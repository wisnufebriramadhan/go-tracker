<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Geo Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
    }
    .login-card .brand {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }
    .login-card .tagline {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .login-card h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    .login-card .error-banner {
      background: var(--red);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .login-card form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-card label {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .login-card input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .login-card input:focus {
      border-color: var(--primary);
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .login-card button:hover {
      filter: brightness(1.05);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">📍 Geo Tracker</div>
      <div class="tagline">Dashboard login</div>
      <h2>Sign in</h2>

      {% if error %}
        <div class="error-banner">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required
               placeholder="admin">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required
               placeholder="••••••••">

        <button type="submit">Sign in →</button>
      </form>
    </div>
  </div>
</body>
</html>
